<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Last Birthday Thing 🎂❤️</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
padding:20px 16px;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:linear-gradient(145deg,#fff0f6,#ffd8e8,#fff8fb);
color:#60253e;
overflow:hidden;
}

.container{
width:100%;
max-width:430px;
text-align:center;
}

.card{
position:relative;
padding:30px 20px;
border-radius:28px;
background:rgba(255,255,255,.95);
box-shadow:0 15px 50px rgba(100,38,63,.16);
overflow:hidden;
animation:appear 1s ease;
}

.glow{
position:absolute;
width:180px;
height:180px;
border-radius:50%;
background:rgba(255,170,200,.25);
filter:blur(40px);
top:-80px;
right:-70px;
}

h1{
font-size:25px;
margin:0 0 10px;
}

.subtitle{
font-size:15px;
opacity:.7;
line-height:1.5;
}

.cake-area{
margin-top:35px;
height:250px;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.cake{
position:relative;
width:210px;
height:150px;
margin-top:35px;
}

.cake-top{
position:absolute;
top:45px;
left:10px;
width:190px;
height:55px;
border-radius:50%;
background:#ff9fbd;
box-shadow:0 5px 0 #e8799c;
}

.cake-body{
position:absolute;
top:70px;
left:10px;
width:190px;
height:70px;
background:#ffb6cc;
border-radius:0 0 22px 22px;
}

.cream{
position:absolute;
top:78px;
left:25px;
width:160px;
height:25px;
background:#fff5f8;
border-radius:50%;
z-index:3;
}

.candle{
position:absolute;
bottom:90px;
width:13px;
height:48px;
background:#fff;
border-radius:4px;
z-index:5;
}

.candle:nth-child(1){
left:57px;
}

.candle:nth-child(2){
left:99px;
}

.candle:nth-child(3){
left:141px;
}

.flame{
position:absolute;
top:-23px;
left:2px;
width:10px;
height:18px;
background:#ffb000;
border-radius:50% 50% 45% 45%;
animation:flicker .45s infinite alternate;
box-shadow:0 0 14px #ffb000;
}

.flame.off{
display:none;
}

.candle.out{
opacity:.75;
}

.wish{
font-size:20px;
font-weight:bold;
margin-top:15px;
}

button{
border:0;
padding:14px 23px;
border-radius:30px;
background:#e95783;
color:white;
font-size:16px;
cursor:pointer;
margin-top:18px;
box-shadow:0 8px 22px rgba(233,87,131,.25);
}

.after{
display:none;
animation:pop .9s ease;
}

.after.show{
display:block;
}

.big{
font-size:27px;
font-weight:bold;
margin-bottom:10px;
}

.love{
font-size:22px;
font-weight:bold;
line-height:1.5;
}

.quote{
margin-top:20px;
font-size:17px;
line-height:1.6;
background:#fff2f7;
padding:17px;
border-radius:20px;
}

.float{
position:fixed;
pointer-events:none;
font-size:24px;
z-index:20;
animation:floatUp 3s linear forwards;
}

.confetti{
position:fixed;
pointer-events:none;
font-size:22px;
z-index:30;
animation:fall 3s linear forwards;
}

.sparkle{
position:fixed;
pointer-events:none;
font-size:19px;
z-index:25;
animation:spark 1.8s ease forwards;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(30px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

@keyframes pop{
0%{
opacity:0;
transform:scale(.7);
}
70%{
transform:scale(1.06);
}
100%{
opacity:1;
transform:scale(1);
}
}

@keyframes flicker{
from{
transform:scale(.9) rotate(-3deg);
}
to{
transform:scale(1.12) rotate(3deg);
}
}

@keyframes floatUp{
from{
opacity:1;
transform:translateY(0) scale(.7);
}
to{
opacity:0;
transform:translateY(-300px) scale(1.4) rotate(20deg);
}
}

@keyframes fall{
from{
opacity:1;
transform:translateY(-30px) rotate(0);
}
to{
opacity:0;
transform:translateY(650px) rotate(360deg);
}
}

@keyframes spark{
from{
opacity:1;
transform:scale(.5);
}
to{
opacity:0;
transform:scale(1.8) translateY(-60px);
}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="glow"></div>

<h1>
Okayyy… one last thinggg 🎂🤭❤️
</h1>

<div class="subtitle">
Because apparently one birthday link wasn't enoughhh 😭🫶🏻
</div>

<div class="cake-area">

<div class="cake">

<div class="cake-top"></div>

<div class="cake-body"></div>

<div class="cream"></div>

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div
